[project]
name = "rembg-background-removal"
version = "0.1.0"
description = "Batch image background removal with danielgatis/rembg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "rembg[cpu]>=2.0.67",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
